version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EmployeeDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EmployeeDb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - employee-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EmployeeDb;Username=postgres;Password=postgres;
    networks:
      - employee-network

volumes:
  postgres-data:
    name: employee-postgres-data

networks:
  employee-network:
    name: employee-network
    driver: bridge
